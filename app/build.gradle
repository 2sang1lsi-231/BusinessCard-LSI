plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lsi.businesscard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lsi.businesscard'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled on-device Korean text recognizer: business-card OCR works without uploading card images to a server.
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
