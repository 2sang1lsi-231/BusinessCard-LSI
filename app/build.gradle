plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lsi.businesscard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lsi.businesscard'
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName '2.6'
        testInstrumentationRunner 'com.lsi.businesscard.AppChecks'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    // Bundled on-device Korean text recognizer: business-card OCR works without uploading card images to a server.
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}
